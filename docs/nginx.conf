# nginx config mirroring public/.htaccess.
# The map block belongs in the http {} context; the server {} block in sites-available.

# 1 = blocked User-Agent. ~ is case-sensitive, ~* is case-insensitive.
map $http_user_agent $bad_bot {
    default                       0;
    # Empty or "-" user agents
    ""                            1;
    "-"                           1;
    # Bad bots and scrapers
    "~^BlackWidow"                1;
    "~^Bot mailto:craftbot@yahoo\.com" 1;
    "~^ChinaClaw"                 1;
    "~^Custo"                     1;
    "~^DISCo"                     1;
    "~^Download Demon"            1;
    "~^eCatch"                    1;
    "~^EirGrabber"                1;
    "~^EmailSiphon"               1;
    "~^EmailWolf"                 1;
    "~^Express WebPictures"       1;
    "~^ExtractorPro"              1;
    "~^EyeNetIE"                  1;
    "~^FlashGet"                  1;
    "~^GetRight"                  1;
    "~^GetWeb!"                   1;
    "~^Go!Zilla"                  1;
    "~^Go-Ahead-Got-It"           1;
    "~^GrabNet"                   1;
    "~^Grafula"                   1;
    "~^HMView"                    1;
    "~*HTTrack"                   1;
    "~^Image Stripper"            1;
    "~^Image Sucker"              1;
    "~*Indy Library"              1;
    "~^InterGET"                  1;
    "~^Internet Ninja"            1;
    "~^JetCar"                    1;
    "~^JOC Web Spider"            1;
    "~^larbin"                    1;
    "~^LeechFTP"                  1;
    "~^Mass Downloader"           1;
    "~^MIDown tool"               1;
    "~^Mister PiX"                1;
    "~^Navroad"                   1;
    "~^NearSite"                  1;
    "~^NetAnts"                   1;
    "~^NetSpider"                 1;
    "~^Net Vampire"               1;
    "~^NetZIP"                    1;
    "~^Octopus"                   1;
    "~^Offline Explorer"          1;
    "~^Offline Navigator"         1;
    "~^PageGrabber"               1;
    "~^Papa Foto"                 1;
    "~^pavuk"                     1;
    "~^pcBrowser"                 1;
    "~^RealDownload"              1;
    "~^ReGet"                     1;
    "~^SiteSnagger"               1;
    "~^SmartDownload"             1;
    "~^SuperBot"                  1;
    "~^SuperHTTP"                 1;
    "~^Surfbot"                   1;
    "~^tAkeOut"                   1;
    "~^Teleport Pro"              1;
    "~^VoidEYE"                   1;
    "~^Web Image Collector"       1;
    "~^Web Sucker"                1;
    "~^WebAuto"                   1;
    "~^WebCopier"                 1;
    "~^WebFetch"                  1;
    "~^WebGo IS"                  1;
    "~^WebLeacher"                1;
    "~^WebReaper"                 1;
    "~^WebSauger"                 1;
    "~^Website eXtractor"         1;
    "~^Website Quester"           1;
    "~^WebStripper"               1;
    "~^WebWhacker"                1;
    "~^WebZIP"                    1;
    "~^Wget"                      1;
    "~^Widow"                     1;
    "~^WWWOFFLE"                  1;
    "~^Xaldon WebSpider"          1;
    "~^Zeus"                      1;
    # AI training crawlers
    "~*(GPTBot|ChatGPT-User|CCBot|anthropic-ai|Claude-Web|cohere-ai|Omgili|Diffbot|FacebookBot|Bytespider|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot)" 1;
}

server {
    listen 80;
    server_name example.com;
    root /path/to/retroarch-assets-server/public;
    index index.html;

    # No directory listings (RetroArch uses .index files instead)
    autoindex off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Block empty user agents, bad bots and scrapers
    if ($bad_bot) {
        return 403;
    }

    # Deny .htaccess and other .ht* files (.index* dotfiles are still served)
    location ~ /\.ht {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
